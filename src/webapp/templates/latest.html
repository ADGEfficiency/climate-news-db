<!doctype html>
<html lang="en">
  {{template "head" .}}
  <body class="bg-gray-50 min-h-screen">
    {{template "navbar" .}}
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
      <div class="px-4 py-6 sm:px-0">
        <!-- Latest Published Articles -->
        <div class="bg-white shadow rounded-lg">
          <div class="px-6 py-4 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900 flex items-center">
              <svg
                class="w-6 h-6 mr-2 text-blue-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              Latest Articles
            </h1>
          </div>
          <div class="divide-y divide-gray-200">
            {{ range .latestPublished }}
            <div class="px-6 py-4 hover:bg-gray-50">
              <div class="flex items-start justify-between">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center mb-2">
                    <div
                      class="w-2 h-2 rounded-full mr-2"
                      style="background-color: {{.NewspaperColor}}"
                    ></div>
                    <a
                      href="/newspaper/{{.NewspaperName}}"
                      class="text-xs font-medium text-gray-500 hover:text-blue-600"
                      >{{.NewspaperFancy}}</a
                    >
                    <span class="mx-2 text-gray-300">•</span>
                    <span class="text-xs text-gray-500"
                      >{{ formatDate .DatePublished }}</span
                    >
                  </div>
                  <h3 class="text-sm font-medium text-gray-900 mb-2">
                    <a href="/article/{{.ID}}" class="hover:text-blue-600"
                      >{{.Headline}}</a
                    >
                  </h3>
                  <div
                    class="flex items-center text-xs text-gray-500 space-x-4"
                  >
                    <span>{{.ArticleLength}} words</span>
                    <a
                      href="{{.ArticleURL}}"
                      target="_blank"
                      class="text-blue-600 hover:text-blue-800"
                      >Read Original</a
                    >
                  </div>
                </div>
              </div>
            </div>
            {{ end }}
          </div>
        </div>
      </div>
    </main>
    {{ template "footer" }}
  </body>
</html>
